<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">

  <title>إدارة KORA TV VIP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #f5f5f5;
      font-family: "Cairo", sans-serif;
    }

    button, input, select {
      font-family: inherit;
    }

    .topbar {
      background: #111;
      border-bottom: 1px solid #292929;
      padding: 17px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .topbar h2 {
      margin: 0;
      color: #d7b45a;
      font-size: 19px;
    }

    a {
      color: #d7b45a;
      text-decoration: none;
    }

    .container {
      width: min(950px, 94%);
      margin: 25px auto;
    }

    .panel {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 13px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    h1 {
      font-size: 23px;
    }

    h2 {
      color: #d7b45a;
      font-size: 19px;
    }

    h3 {
      font-size: 16px;
    }

    p {
      color: #aaa;
    }

    label {
      display: block;
      margin: 13px 0;
      color: #ddd;
      font-size: 14px;
    }

    input, select {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      background: #090909;
      border: 1px solid #353535;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #d7b45a;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .primary {
      background: #d7b45a;
      color: #111;
    }

    .secondary {
      background: #303030;
      color: white;
    }

    .danger {
      background: #a52d2d;
      color: white;
    }

    .form-actions, .row-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .message {
      min-height: 22px;
      color: #d7b45a;
      font-size: 13px;
    }

    .notice {
      color: #aaa;
      font-size: 14px;
    }

    .error {
      color: #ff7777;
    }

    .admin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #0c0c0c;
      border: 1px solid #292929;
      border-radius: 9px;
      padding: 13px;
      margin: 10px 0;
    }

    .admin-row strong {
      display: block;
      color: #fff;
    }

    .admin-row small {
      display: block;
      color: #999;
      margin-top: 5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    hr {
      border: 0;
      border-top: 1px solid #303030;
      margin: 22px 0;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .admin-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar h2 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <h2>⚙️ إدارة KORA TV VIP</h2>
  <a href="index.html">عرض التطبيق</a>
</header>

<main class="container">

  <!-- تسجيل الدخول -->
  <section id="login-panel" class="panel">
    <h1>تسجيل دخول الإدارة</h1>

    <label>
      البريد الإلكتروني
      <input id="email" type="email" autocomplete="username" required>
    </label>

    <label>
      كلمة المرور
      <input id="password" type="password" autocomplete="current-password" required>
    </label>

    <button id="login-btn" class="primary" type="button">
      دخول
    </button>

    <p id="login-message" class="message"></p>
  </section>

  <!-- لوحة التحكم -->
  <section id="admin-panel" hidden>

    <div class="panel">
      <div class="panel-heading">
        <h1>لوحة التحكم</h1>
        <button
  type="button"
  onclick="alert('JavaScript يعمل')"
  style="background:gold;color:black;padding:15px;width:100%"
>
  اختبار الزر
</button>
      </div>
    </div>

    <!-- استيراد المباريات -->
    <section class="panel">
      <h2>استيراد المباريات تلقائياً</h2>
      <p>اجلب المباريات من خدمة Football Data API.</p>

      <button id="fetch-matches-btn" class="primary" type="button">
        تحديث المباريات
      </button>

      <p id="api-message" class="message"></p>
      <div id="api-matches"></div>
    </section>

    <!-- إدارة القنوات -->
    <section class="panel">
      <h2>إدارة القنوات</h2>
      <p>أضف روابط مشغّلات القنوات التي تملك تصريحاً باستخدامها.</p>

      <form id="channel-form">

        <label>
          اسم القناة
          <input
            id="channel-name"
            type="text"
            maxlength="100"
            placeholder="مثلاً: قناتي"
            required
          >
        </label>

        <label>
          رابط المشغّل
          <input
            id="channel-stream-url"
            type="url"
            placeholder="https://..."
            required
          >
        </label>

        <div class="form-actions">
          <button id="save-channel-btn" class="primary" type="submit">
            حفظ القناة
          </button>

          <button
            id="cancel-channel-edit"
            class="secondary"
            type="button"
            hidden
          >
            إلغاء التعديل
          </button>
        </div>

        <p id="channel-message" class="message"></p>
      </form>

      <hr>

      <h3>القنوات المحفوظة</h3>
      <div id="admin-channels">
        <p class="notice">جارٍ التحميل...</p>
      </div>
    </section>

    <!-- إضافة وتعديل مباراة -->
    <section class="panel">

      <h2 id="form-title">إضافة مباراة</h2>

      <form id="match-form">

        <input id="match-id" type="hidden">

        <div class="form-grid">

          <label>
            الفريق الأول
            <input id="home-team" required maxlength="80">
          </label>

          <label>
            الفريق الثاني
            <input id="away-team" required maxlength="80">
          </label>

          <label>
            البطولة
            <input id="competition" maxlength="120">
          </label>

          <label>
            موعد المباراة (توقيت بغداد)
            <input id="match-time" type="datetime-local" required>
          </label>

          <label>
            رابط شعار الفريق الأول
            <input id="home-logo" type="url" placeholder="https://...">
          </label>

          <label>
            رابط شعار الفريق الثاني
            <input id="away-logo" type="url" placeholder="https://...">
          </label>

          <label>
            القناة الناقلة
            <select id="channel">
              <option value="">بدون قناة</option>
              <option value="beIN Sports 1">beIN Sports 1</option>
              <option value="beIN Sports 2">beIN Sports 2</option>
              <option value="beIN Sports 3">beIN Sports 3</option>
              <option value="beIN Sports 4">beIN Sports 4</option>
              <option value="beIN Sports 5">beIN Sports 5</option>
            </select>
          </label>

          <label class="full">
            رابط البث الخاص بالمباراة
            <input id="stream-url" type="url" placeholder="https://...">
          </label>

        </div>

        <div class="form-actions">
          <button class="primary" type="submit">
            حفظ المباراة
          </button>

          <button
            class="secondary"
            type="button"
            id="cancel-edit"
            hidden
          >
            إلغاء التعديل
          </button>
        </div>

        <p id="form-message" class="message"></p>

      </form>
    </section>

    <!-- المباريات -->
    <section class="panel">
      <h2>المباريات المضافة</h2>

      <div id="admin-matches">
        <p class="notice">جارٍ التحميل...</p>
      </div>
    </section>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>

</body>
</html>
