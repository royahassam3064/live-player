<!doctype html>

<html lang="ar" dir="rtl"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">  <title>مشاهدة البث - Kora TV</title>  <link rel="stylesheet" href="style.css">  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script defer src="config.js"></script>  <script defer src="watch.js"></script>  <style>
    #video-frame {
      position: relative;
      width: 640px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      margin: 15px auto;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 1;
    }

    /* المستطيل الأسود */
    #video-frame .right-black-cover {
      position: absolute;
      top: 7.2%;
      right: 12px;
      width: 150px;
      height: 46px;
      background: #000;
      z-index: 20;
      pointer-events: none;
      display: block;
      visibility: visible;
      opacity: 1;
    }

    /* زر ملء الشاشة */
    #fullscreen-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 30;
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      background: rgba(0, 0, 0, .9);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ملء شاشة إطار الموقع */
    #video-frame:fullscreen,
    #video-frame:-webkit-full-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      aspect-ratio: auto;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #video-frame:fullscreen iframe,
    #video-frame:-webkit-full-screen iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 1;
    }

    #video-frame:fullscreen .right-black-cover,
    #video-frame:-webkit-full-screen .right-black-cover {
      position: absolute;
      top: 7.2%;
      right: 18px;
      width: 150px;
      height: 46px;
      background: #000;
      z-index: 20;
      display: block;
      visibility: visible;
      opacity: 1;
    }

    #video-frame:fullscreen #fullscreen-btn,
    #video-frame:-webkit-full-screen #fullscreen-btn {
      z-index: 30;
    }

    @media (max-width: 500px) {
      #video-frame .right-black-cover {
        top: 7.2%;
        right: 8px;
        width: 100px;
        height: 36px;
      }

      #fullscreen-btn {
        right: 8px;
        bottom: 8px;
        padding: 8px 11px;
      }
    }
  </style></head><body class="watch-page">  <header class="topbar">
    <a class="admin-link" href="index.html">
      رجوع للمباريات
    </a><div class="brand">
  البث المباشر
</div>

  </header>  <main class="container"><h1 id="watch-title">
  جارٍ تحميل البث...
</h1>

<div class="video-frame" id="video-frame">

  <p class="notice" id="loading-notice">
    جارٍ تحميل المشغّل...
  </p>

  <div class="right-black-cover"></div>

  <button type="button" id="fullscreen-btn">
    ⛶ ملء الشاشة
  </button>

</div>

<p class="footer-note">
  يجب أن يسمح مصدر البث بالتضمين داخل المواقع.
  بعض الروابط لا تعمل داخل إطار iframe.
</p>

  </main>  <script>
    (() => {
      "use strict";

      const player = document.getElementById("video-frame");
      const button = document.getElementById("fullscreen-btn");

      button.addEventListener("click", async () => {
        try {
          const active =
            document.fullscreenElement ||
            document.webkitFullscreenElement;

          if (active) {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          } else {
            if (player.requestFullscreen) {
              await player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
              player.webkitRequestFullscreen();
            } else {
              alert("المتصفح لا يدعم ملء الشاشة.");
            }
          }
        } catch (error) {
          console.error("Fullscreen error:", error);
        }
      });

      function updateButton() {
        const active =
          document.fullscreenElement ||
          document.webkitFullscreenElement;

        button.textContent = active
          ? "⛶ خروج من ملء الشاشة"
          : "⛶ ملء الشاشة";
      }

      document.addEventListener("fullscreenchange", updateButton);
      document.addEventListener("webkitfullscreenchange", updateButton);
    })();
  </script></body>
</html>
