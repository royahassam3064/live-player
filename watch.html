<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">

  <title>مشاهدة البث - KORA TV VIP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="watch.js"></script>

  <style>
    .watch-page {
      min-height: 100vh;
      background: #080808;
      font-family: "Noto Sans Arabic", sans-serif;
    }

    .watch-page .container {
      width: min(100% - 24px, 1000px);
      margin: 20px auto 90px;
    }

    #watch-title {
      margin: 18px 0;
      color: #f1d27a;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
    }

    #player-shell {
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(214,173,69,.35);
      border-radius: 13px;
      background: #000;
    }

    .watch-logos {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px;
      background: #080808;
      border-bottom: 1px solid rgba(214,173,69,.25);
    }

    .watch-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 42px;
      padding: 5px;
      overflow: hidden;
      border-radius: 7px;
      background: #fff;
    }

    .watch-logo img {
      display: block;
      width: 100%;
      max-height: 58px;
      object-fit: contain;
    }

    #video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }

    #video-frame iframe,
    #video-frame video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .watch-loading {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-height: 220px;
      padding: 20px;
      color: #f1d27a;
      background: #080808;
      text-align: center;
      font-size: 14px;
      line-height: 1.9;
    }

    .footer-note {
      margin: 16px 0;
      color: #999;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    @media (max-width: 480px) {
      .watch-page .container {
        width: calc(100% - 16px);
        margin-top: 12px;
      }

      #watch-title {
        font-size: 17px;
      }

      .watch-logo img {
        max-height: 48px;
      }
    }
  </style>
</head>

<body class="watch-page">

  <header class="topbar">
    <a class="admin-link" href="index.html">
      رجوع للمباريات
    </a>

    <div class="brand">
      <span>KORA <b>TV VIP</b></span>
    </div>
  </header>

  <main class="container">

    <h1 id="watch-title">
      جارٍ تحميل البث...
    </h1>

    <div id="player-shell">

      <div class="watch-logos">

        <div class="watch-logo">
          <img
            src="https://i.postimg.cc/GhqfFVBK/1794151382661-copy-1032x279.jpg"
            alt="KORA TV"
          >
        </div>

        <div class="watch-logo">
          <img
            src="https://i.postimg.cc/4NB06qK4/1794151382661-copy-1032x168-copy-1032x168.jpg"
            alt="KORA TV VIP"
          >
        </div>

      </div>

      <div id="video-frame">

        <div class="watch-loading" id="loading-notice">
          جارٍ تحميل المشغّل...
        </div>

      </div>

    </div>

    <p class="footer-note">
      يعتمد تشغيل الفيديو على دعم مصدر البث للتضمين داخل المواقع.
    </p>

  </main>

  <script>
(() => {
  // إنشاء سجل رجوع داخل صفحة المشغّل
  history.pushState({ playerPage: true }, "", location.href);

  window.addEventListener("popstate", () => {
    // البقاء بصفحة المشغّل عند الضغط على رجوع
    history.pushState({ playerPage: true }, "", location.href);
  });
})();
</script>
</body>
</html>
