<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">

  <title>مشاهدة البث - Kora TV</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="watch.js"></script>

  <style>
    /* الحاوية الرئيسية */
    #player-shell {
      position: relative;
      width: 640px;
      max-width: 100%;
      margin: 15px auto;
      background: #000;
    }

    /* إطار الفيديو */
    #video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      z-index: 1;
    }

    /* طبقة التغطيات */
    .player-overlays {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    /* تغطية الشعار العلوي */
    .sir-cover {
      position: absolute;
      top: 7.2%;
      right: 12px;
      width: 150px;
      height: 46px;
      background: #000;
    }

    /* تغطية الشعار السفلي */
    .koraplus-cover {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: #000;
    }

    /* شريط زر ملء الشاشة - منفصل عن الفيديو */
    .player-toolbar {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10131b;
      padding: 8px;
      box-sizing: border-box;
    }

    #fullscreen-btn {
      border: 0;
      border-radius: 8px;
      padding: 11px 24px;
      background: #5b42c5;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #fullscreen-btn:active {
      opacity: .8;
    }

    /* وضع ملء الشاشة */
    #player-shell:fullscreen,
    #player-shell:-webkit-full-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      isolation: isolate;
    }

    /* الفيديو يتمدد داخل الشاشة */
    #player-shell:fullscreen #video-frame,
    #player-shell:-webkit-full-screen #video-frame {
      flex: 1;
      min-height: 0;
      width: 100%;
      height: auto;
      aspect-ratio: auto;
    }

    #player-shell:fullscreen iframe,
    #player-shell:-webkit-full-screen iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* التغطية العلوية أثناء ملء الشاشة */
    #player-shell:fullscreen .sir-cover,
    #player-shell:-webkit-full-screen .sir-cover {
      top: 7.2%;
      right: 18px;
      width: 150px;
      height: 46px;
    }

    /* التغطية السفلية أثناء ملء الشاشة */
    #player-shell:fullscreen .koraplus-cover,
    #player-shell:-webkit-full-screen .koraplus-cover {
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
    }

    /* شريط الزر يبقى خارج مساحة الفيديو */
    #player-shell:fullscreen .player-toolbar,
    #player-shell:-webkit-full-screen .player-toolbar {
      flex: 0 0 58px;
      min-height: 58px;
      background: #10131b;
    }

    /* الهواتف */
    @media (max-width: 500px) {
      .sir-cover {
        top: 7.2%;
        right: 8px;
        width: 100px;
        height: 36px;
      }

      .koraplus-cover {
        height: 42px;
      }

      .player-toolbar {
        min-height: 54px;
      }

      #fullscreen-btn {
        padding: 9px 20px;
        font-size: 14px;
      }

      #player-shell:fullscreen .sir-cover,
      #player-shell:-webkit-full-screen .sir-cover {
        right: 8px;
        width: 100px;
        height: 36px;
      }

      #player-shell:fullscreen .koraplus-cover,
      #player-shell:-webkit-full-screen .koraplus-cover {
        height: 42px;
      }
    }
  </style>
</head>

<body class="watch-page">

  <header class="topbar">

    <a class="admin-link" href="index.html">
      رجوع للمباريات
    </a>

    <div class="brand">
      البث المباشر
    </div>

  </header>

  <main class="container">

    <h1 id="watch-title">
      جارٍ تحميل البث...
    </h1>

    <div id="player-shell">

      <div class="video-frame" id="video-frame">

        <p class="notice" id="loading-notice">
          جارٍ تحميل المشغّل...
        </p>

        <!-- طبقة التغطيات -->
        <div class="player-overlays">

          <div class="sir-cover"></div>

          <div class="koraplus-cover"></div>

        </div>

      </div>

      <!-- زر مستقل خارج الفيديو -->
      <div class="player-toolbar">

        <button type="button" id="fullscreen-btn">
          ⛶ ملء الشاشة
        </button>

      </div>

    </div>

    <p class="footer-note">
      يجب أن يسمح مصدر البث بالتضمين داخل المواقع.
      بعض الروابط لا تعمل داخل إطار iframe.
    </p>

  </main>

  <script>
    (() => {
      "use strict";

      const shell = document.getElementById("player-shell");
      const button = document.getElementById("fullscreen-btn");

      function isFullscreen() {
        return Boolean(
          document.fullscreenElement ||
          document.webkitFullscreenElement
        );
      }

      async function toggleFullscreen() {
        try {

          if (isFullscreen()) {

            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }

          } else {

            if (shell.requestFullscreen) {
              await shell.requestFullscreen();
            } else if (shell.webkitRequestFullscreen) {
              shell.webkitRequestFullscreen();
            } else {
              alert("المتصفح لا يدعم ملء الشاشة.");
            }

          }

        } catch (error) {
          console.error("Fullscreen error:", error);
        }
      }

      function updateButton() {
        button.textContent = isFullscreen()
          ? "⛶ خروج من ملء الشاشة"
          : "⛶ ملء الشاشة";
      }

      button.addEventListener("click", toggleFullscreen);

      document.addEventListener("fullscreenchange", updateButton);
      document.addEventListener("webkitfullscreenchange", updateButton);

    })();
  </script>

</body>
</html>
