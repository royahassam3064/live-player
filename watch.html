<!doctype html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">  <title>مشاهدة المباراة - KORA TV VIP</title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">  <link rel="stylesheet" href="style.css">  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="config.js"></script>  <script defer src="watch.js"></script>  <style>
    .watch-logos {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px;
      background: #080808;
      border-bottom: 1px solid rgba(214,173,69,.25);
    }

    .watch-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 42px;
      padding: 5px;
      border-radius: 7px;
      background: #fff;
      overflow: hidden;
    }

    .watch-logo img {
      display: block;
      width: 100%;
      max-height: 58px;
      object-fit: contain;
    }

    #video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #video-frame iframe,
    #video-frame video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    #player-shell:fullscreen,
    #player-shell:-webkit-full-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    #player-shell:fullscreen #video-frame,
    #player-shell:-webkit-full-screen #video-frame {
      flex: 1;
      min-height: 0;
      aspect-ratio: auto;
    }

    #player-shell:fullscreen .watch-logos,
    #player-shell:-webkit-full-screen .watch-logos {
      flex-shrink: 0;
    }

    #player-shell:fullscreen .player-toolbar,
    #player-shell:-webkit-full-screen .player-toolbar {
      flex-shrink: 0;
    }

    .player-toolbar {
      display: flex;
      justify-content: center;
      padding: 10px;
      background: #101010;
    }

    #fullscreen-btn {
      min-height: 42px;
      padding: 10px 24px;
      border: 1px solid #927126;
      border-radius: 9px;
      background: linear-gradient(135deg,#f1d27a,#927126);
      color: #080808;
      font-size: 13px;
      font-weight: 900;
    }

    .watch-loading {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-height: 180px;
      padding: 20px;
      color: #d6ad45;
      text-align: center;
      font-size: 13px;
    }
  </style></head><body class="watch-page">  <header class="topbar"><a class="admin-link" href="index.html">
  رجوع للمباريات
</a>

<div class="brand">
  <span>KORA <b>TV VIP</b></span>
</div>

  </header>  <main class="container"><h1 id="watch-title">
  جارٍ تحميل المباراة...
</h1>


<div id="player-shell">

  <!-- الشعار الأول والثاني فوق الفيديو -->
  <div class="watch-logos">

    <div class="watch-logo">
      <img
        src="https://i.postimg.cc/GhqfFVBK/1794151382661-copy-1032x279.jpg"
        alt="شعار KORA TV"
      >
    </div>

    <div class="watch-logo">
      <img
        src="https://i.postimg.cc/4NB06qK4/1794151382661-copy-1032x168-copy-1032x168.jpg"
        alt="شعار KORA TV VIP"
      >
    </div>

  </div>


  <!-- منطقة الفيديو -->
  <div id="video-frame">

    <div class="watch-loading" id="loading-notice">
      جارٍ تحميل المشغّل...
    </div>

  </div>


  <!-- أدوات المشغّل -->
  <div class="player-toolbar">

    <button
      type="button"
      id="fullscreen-btn"
    >
      ⛶ ملء الشاشة
    </button>

  </div>

</div>


<p class="footer-note">
  يعتمد تشغيل الفيديو على دعم مصدر البث للتضمين داخل المواقع.
</p>

  </main>  <script>
    (() => {
      "use strict";

      const shell = document.getElementById("player-shell");
      const button = document.getElementById("fullscreen-btn");

      function isFullscreen() {
        return Boolean(
          document.fullscreenElement ||
          document.webkitFullscreenElement
        );
      }

      async function toggleFullscreen() {
        try {
          if (isFullscreen()) {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }

            return;
          }

          if (shell.requestFullscreen) {
            await shell.requestFullscreen();
          } else if (shell.webkitRequestFullscreen) {
            shell.webkitRequestFullscreen();
          } else {
            alert("المتصفح لا يدعم ملء الشاشة.");
          }

        } catch (error) {
          console.error("Fullscreen error:", error);
        }
      }

      function updateButton() {
        button.textContent = isFullscreen()
          ? "⛶ خروج من ملء الشاشة"
          : "⛶ ملء الشاشة";
      }

      button.addEventListener("click", toggleFullscreen);

      document.addEventListener(
        "fullscreenchange",
        updateButton
      );

      document.addEventListener(
        "webkitfullscreenchange",
        updateButton
      );

    })();
  </script></body>
</html>
