<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">
  <title>مشاهدة البث - Kora TV</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="watch.js"></script>

  <style>
    #video-frame {
      position: relative !important;
      width: 640px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      margin: 15px auto;
      overflow: hidden;
      background: #000;
      isolation: auto !important;
    }

    #video-frame iframe {
      position: absolute !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0;
      display: block;
      z-index: 0 !important;
    }

    #video-frame .kora-logo {
      position: absolute !important;
      top: 12px;
      right: 12px;
      width: 120px;
      height: 45px;
      max-width: 35%;
      object-fit: contain;
      background: transparent;
      border: 0;
      padding: 0;
      box-sizing: border-box;
      z-index: 2147483647 !important;
      pointer-events: none;
      display: block !important;
    }

    #video-frame .new-watermark {
      position: absolute !important;
      bottom: 12px;
      right: 12px;
      width: 130px;
      height: 45px;
      max-width: 35%;
      object-fit: contain;
      background: transparent;
      border: 0;
      padding: 0;
      box-sizing: border-box;
      z-index: 2147483647 !important;
      pointer-events: none;
      display: block !important;
    }

    #video-frame .fullscreen-btn {
      position: absolute !important;
      left: 12px;
      bottom: 12px;
      z-index: 2147483647 !important;
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      background: rgba(0, 0, 0, .9);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #video-frame:fullscreen,
    #video-frame:-webkit-full-screen {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      aspect-ratio: auto !important;
      margin: 0 !important;
      background: #000;
      overflow: hidden;
    }

    #video-frame:fullscreen iframe,
    #video-frame:-webkit-full-screen iframe {
      width: 100% !important;
      height: 100% !important;
    }

    #video-frame:fullscreen .kora-logo,
    #video-frame:-webkit-full-screen .kora-logo {
      top: 18px;
      right: 18px;
      width: 150px;
      height: 48px;
    }

    #video-frame:fullscreen .new-watermark,
    #video-frame:-webkit-full-screen .new-watermark {
      bottom: 18px;
      right: 18px;
      width: 150px;
      height: 48px;
    }

    @media (max-width: 500px) {
      #video-frame .kora-logo {
        width: 95px;
        height: 36px;
        top: 8px;
        right: 8px;
      }

      #video-frame .new-watermark {
        width: 105px;
        height: 38px;
        bottom: 8px;
        right: 8px;
      }

      #video-frame .fullscreen-btn {
        left: 8px;
        bottom: 8px;
        padding: 8px 11px;
      }
    }
  </style>
</head>

<body class="watch-page">

  <header class="topbar">
    <a class="admin-link" href="index.html">رجوع للمباريات</a>
    <div class="brand">البث المباشر</div>
  </header>

  <main class="container">

    <h1 id="watch-title">جارٍ تحميل البث...</h1>

    <div class="video-frame" id="video-frame">

      <p class="notice" id="loading-notice">
        جارٍ تحميل المشغّل...
      </p>

      <img
        src="kora-tv-logo.png"
        class="kora-logo"
        alt="Kora TV"
      >

      <img
        src="https://i.postimg.cc/jSmhKgmX/lv-0-20261103200323.jpg"
        class="new-watermark"
        alt="Watermark"
      >

      <button
        type="button"
        class="fullscreen-btn"
        id="fullscreen-btn">
        ⛶ ملء الشاشة
      </button>

    </div>

    <p class="footer-note">
      يجب أن يسمح مصدر البث بالتضمين داخل المواقع.
      بعض الروابط لا تعمل داخل إطار iframe.
    </p>

  </main>

  <script>
    const player = document.getElementById("video-frame");
    const fullscreenBtn = document.getElementById("fullscreen-btn");

    fullscreenBtn.addEventListener("click", async function (event) {
      event.preventDefault();
      event.stopPropagation();

      try {
        const isFullscreen =
          document.fullscreenElement ||
          document.webkitFullscreenElement;

        if (!isFullscreen) {
          if (player.requestFullscreen) {
            await player.requestFullscreen();
          } else if (player.webkitRequestFullscreen) {
            player.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      } catch (error) {
        console.error("Fullscreen error:", error);
      }
    });

    function updateFullscreenButton() {
      const isFullscreen =
        !!document.fullscreenElement ||
        !!document.webkitFullscreenElement;

      fullscreenBtn.textContent = isFullscreen
        ? "⛶ خروج من ملء الشاشة"
        : "⛶ ملء الشاشة";
    }

    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
  </script>

</body>
</html>
