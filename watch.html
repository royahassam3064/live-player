<!doctype html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">
  <title>مشاهدة البث - Kora TV</title>  <link rel="stylesheet" href="style.css">  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script defer src="config.js"></script>  <script defer src="watch.js"></script>  <style>
    #video-frame {
      position: relative !important;
      width: 640px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      margin: 15px auto;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #video-frame iframe {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
      display: block;
      z-index: 1 !important;
    }

    /* المستطيل الأسود أعلى يسار الفيديو */
    #video-frame .right-black-cover {
      position: absolute !important;
      top: 7.2% !important;
      right: 12px !important;
      width: 150px !important;
      height: 46px !important;
      background: #000 !important;
      z-index: 10 !important;
      pointer-events: none !important;
    }

    /* العلامة المائية السفلية */
    #video-frame .new-watermark {
      position: absolute !important;
      display: block !important;
      object-fit: contain;
      background: transparent;
      border: 0;
      padding: 0;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 20 !important;

      bottom: 12px;
      right: 12px;
      width: 130px;
      height: 45px;
      max-width: 35%;
    }

    /* زر ملء الشاشة */
    #fullscreen-btn {
      position: absolute !important;
      right: 12px;
      bottom: 12px;
      z-index: 30 !important;
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      background: rgba(0, 0, 0, .9);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* وضع ملء الشاشة */
    #video-frame:fullscreen,
    #video-frame:-webkit-full-screen {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      aspect-ratio: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #000 !important;
      isolation: isolate !important;
    }

    #video-frame:fullscreen iframe,
    #video-frame:-webkit-full-screen iframe {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
    }

    #video-frame:fullscreen .right-black-cover,
    #video-frame:-webkit-full-screen .right-black-cover {
      top: 7.2% !important;
      right: 18px !important;
      width: 150px !important;
      height: 46px !important;
      z-index: 10 !important;
    }

    #video-frame:fullscreen .new-watermark,
    #video-frame:-webkit-full-screen .new-watermark {
      bottom: 18px !important;
      right: 18px !important;
      width: 150px !important;
      height: 48px !important;
      z-index: 20 !important;
    }

    #video-frame:fullscreen #fullscreen-btn,
    #video-frame:-webkit-full-screen #fullscreen-btn {
      z-index: 30 !important;
    }

    @media (max-width: 500px) {
      #video-frame .right-black-cover {
        top: 7.2% !important;
        right: 8px !important;
        width: 100px !important;
        height: 36px !important;
      }

      #video-frame .new-watermark {
        width: 105px;
        height: 38px;
        bottom: 8px;
        right: 8px;
      }

      #fullscreen-btn {
        right: 8px;
        bottom: 8px;
        padding: 8px 11px;
      }
    }
  </style></head><body class="watch-page">  <header class="topbar">
    <a class="admin-link" href="index.html">رجوع للمباريات</a>
    <div class="brand">البث المباشر</div>
  </header>  <main class="container"><h1 id="watch-title">جارٍ تحميل البث...</h1>

<div class="video-frame" id="video-frame">

  <p class="notice" id="loading-notice">
    جارٍ تحميل المشغّل...
  </p>

  <!-- المستطيل الأسود -->
  <div class="right-black-cover"></div>

  <!-- العلامة المائية -->
  <img
    src="https://i.postimg.cc/jSmhKgmX/lv-0-20261103200323.jpg"
    class="new-watermark"
    alt="Watermark"
  >

  <!-- زر ملء الشاشة -->
  <button type="button" id="fullscreen-btn">
    ⛶ ملء الشاشة
  </button>

</div>

<p class="footer-note">
  يجب أن يسمح مصدر البث بالتضمين داخل المواقع.
  بعض الروابط لا تعمل داخل إطار iframe.
</p>

  </main>  <script>
    (() => {
      const player = document.getElementById("video-frame");
      const button = document.getElementById("fullscreen-btn");

      button.addEventListener("click", async () => {
        try {
          if (
            document.fullscreenElement ||
            document.webkitFullscreenElement
          ) {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          } else {
            if (player.requestFullscreen) {
              await player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
              player.webkitRequestFullscreen();
            } else {
              alert("المتصفح لا يدعم ملء الشاشة بهذه الطريقة.");
            }
          }
        } catch (error) {
          console.error("Fullscreen error:", error);
        }
      });

      function updateButton() {
        const active =
          document.fullscreenElement ||
          document.webkitFullscreenElement;

        button.textContent = active
          ? "⛶ خروج من ملء الشاشة"
          : "⛶ ملء الشاشة";
      }

      document.addEventListener("fullscreenchange", updateButton);
      document.addEventListener("webkitfullscreenchange", updateButton);
    })();
  </script></body>
</html>
